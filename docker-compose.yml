version: "3.9"

services:
  # ── Purple Agent: Phase 2 Execution Engine ──────────────────────────────────
  purple-agent:
    build: .
    image: purple-agent:latest
    container_name: purple-agent-server
    ports:
      - "9010:9010"
    environment:
      # Secrets and LLM Configuration
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_BASE_URL=https://openrouter.ai/api/v1
      - MODEL_NAME=deepseek/deepseek-v4-flash
      
      # Agent Loop Configuration
      - PORT=9010
      - MAX_TURNS=50
      - LOG_LEVEL=INFO
    volumes:
      # CRITICAL: Enables sibling container spawning for test execution
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - purple-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9010/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Local vLLM (Optional Profile for GPU hosts) ───────────────────────────
  # Run with: docker-compose --profile local-llm up
  vllm:
    profiles: ["local-llm"]
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command: >
      --model deepseek-ai/DeepSeek-V3
      --tensor-parallel-size 1
      --max-model-len 32768
      --gpu-memory-utilization 0.90
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - purple-net

networks:
  purple-net:
    driver: bridge