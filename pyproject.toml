[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purple-coding-agent"
version = "4.2.0"
description = "Phase 2: Stateful REPL Agent with Docker-out-of-Docker execution"
requires-python = ">=3.11"
dependencies = [
    # API & A2A Handshake 
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "openai>=1.30.0",        # Powering the AsyncOpenAI LLMClient
    
    # Infrastructure & Execution
    "docker>=7.1.0",         # Required for the DockerBridge sibling containers
    
    # Structural Analysis (Graph RAG)
    "tree-sitter>=0.21.3",   # Required for ASTGraphBuilder
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",

    # HTTP client
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0", # Essential for testing AsyncOpenAI and AgentLoop
    "httpx>=0.27.0",
    "ruff>=0.4.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]