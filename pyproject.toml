[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purple-coding-agent"
version = "4.2.1"
description = "Phase 2: Stateful REPL Agent with Docker-out-of-Docker execution"
requires-python = ">=3.11"
dependencies = [
    # API & A2A server
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",

    # LLM client (AsyncOpenAI wraps OpenRouter for Gemini/DeepSeek)
    "openai>=1.30.0",

    # Docker-out-of-Docker: sibling container management
    "docker>=7.1.0",

    # Graph RAG: AST parsing for repo skeleton generation
    # NOTE: grammar packages must match tree-sitter version
    "tree-sitter>=0.21.3",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",   # required for async test support
    "httpx>=0.27.0",            # used by fastapi TestClient
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]